<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Send Schedule Pro feedback. Opens a Google Form — no account required in the app.">
  <title>Send feedback · Schedule Pro</title>
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://docs.google.com">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #070b14;
      color: #e8eef9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 26rem;
      text-align: center;
    }
    .brand {
      font-size: 0.85rem;
      color: #8b9bb8;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { color: #8b9bb8; line-height: 1.5; margin: 0 0 1.1rem; }
    a {
      color: #041018;
      background: #3ddcff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.7rem 1.1rem;
      border-radius: 10px;
      display: inline-block;
    }
    .back { display: block; margin-top: 1rem; color: #9ae8ff; background: none; font-weight: 500; }
  </style>
  <script>
    (function () {
      var FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdTItic0S6Z0PPjZHqMrxCOuOTJ-kDpEeZPMssry-14DCqq4Q/viewform';
      var VERSION_ENTRY = '1660499571';
      function version() {
        try {
          var v = new URLSearchParams(location.search).get('v') || '';
          return String(v).replace(/^v/i, '').trim();
        } catch (e) { return ''; }
      }
      function formUrl() {
        var v = version();
        if (!v) return FORM;
        return FORM + '?usp=pp_url&entry.' + VERSION_ENTRY + '=' + encodeURIComponent(v);
      }
      window.MSB_FEEDBACK_FORM = FORM;
      window.MSB_FEEDBACK_URL = formUrl();
      if (navigator.onLine !== false) {
        location.replace(formUrl());
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="brand">Schedule Pro</div>
    <h1>Send feedback</h1>
    <p>Opens a Google Form. Results go to the Schedule Pro team. Needs a network connection. No email address is collected from the app.</p>
    <a id="fb-continue" href="https://docs.google.com/forms/d/e/1FAIpQLSdTItic0S6Z0PPjZHqMrxCOuOTJ-kDpEeZPMssry-14DCqq4Q/viewform">Continue to form</a>
    <a class="back" href="./">Back to app</a>
  </div>
  <script>
    (function () {
      var a = document.getElementById('fb-continue');
      if (a && window.MSB_FEEDBACK_URL) a.href = window.MSB_FEEDBACK_URL;
    })();
  </script>
</body>
</html>
