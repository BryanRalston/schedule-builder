<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Send feedback for Schedule Pro. Optional note plus app version — copy or email. No account required.">
  <title>Send feedback · Schedule Pro</title>
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #e8eef9;
      --muted: #8b9bb8;
      --line: rgba(120, 180, 255, 0.14);
      --card: rgba(16, 24, 40, 0.72);
      --brand: #3ddcff;
      --bg0: #070b14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 15% -5%, rgba(124, 92, 255, 0.18), transparent 55%),
        radial-gradient(800px 480px at 95% 5%, rgba(61, 220, 255, 0.12), transparent 50%),
        linear-gradient(180deg, #050810 0%, #070b14 40%, #0a101c 100%);
      min-height: 100vh;
      line-height: 1.55;
      letter-spacing: -0.015em;
    }
    a { color: #9ae8ff; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 1.25rem 1.15rem 3rem; }
    header {
      padding: 1.75rem 0 1rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.5rem;
    }
    .brand {
      display: flex; align-items: center; gap: 0.65rem;
      font-size: 0.88rem; color: var(--muted); font-weight: 600;
    }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    h1 {
      margin: 0.85rem 0 0.45rem;
      font-size: clamp(1.45rem, 4vw, 1.9rem);
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(120deg, #fff 0%, #b8e9ff 45%, #a78bfa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lede { color: var(--muted); font-size: 1.02rem; max-width: 36rem; margin: 0; }
    .card {
      margin: 1.5rem 0;
      padding: 1.25rem 1.2rem;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid rgba(61,220,255,0.22);
      box-shadow: 0 0 40px rgba(61,220,255,0.08), 0 24px 60px rgba(0,0,0,0.45);
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0.85rem 0 0.35rem;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(7, 11, 20, 0.7);
      color: var(--ink);
      font: inherit;
    }
    textarea { min-height: 8rem; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.1rem; }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font: 600 0.95rem/1 'Space Grotesk', system-ui, sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: #3ddcff; color: #041018; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid var(--line); }
    .msg { min-height: 1.3rem; margin-top: 0.75rem; font-size: 0.88rem; color: #3de28c; }
    .msg.err { color: #ff8b8b; }
    footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      justify-content: space-between;
    }
    footer a { color: #9ae8ff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        Schedule Pro
      </div>
      <h1>Send feedback</h1>
      <p class="lede">Tell Bryan what broke, what confused you, or what you need before posting a schedule. Version is included automatically. No account, no cloud sync.</p>
    </header>

    <div class="card">
      <label for="fb-version">App version</label>
      <input id="fb-version" type="text" readonly value="">

      <label for="fb-note">Note (optional)</label>
      <textarea id="fb-note" maxlength="4000" placeholder="What happened? What did you expect?"></textarea>

      <div class="row">
        <button type="button" class="btn-primary" id="btn-email">Open email</button>
        <button type="button" class="btn-secondary" id="btn-copy">Copy for paste</button>
        <a class="btn btn-secondary" href="./">Back to app</a>
      </div>
      <div class="msg" id="fb-msg"></div>
    </div>

    <footer>
      <div>
        <a href="./">App</a> ·
        <a href="buy.html">Buy Pro</a> ·
        <a href="legal/privacy.html">Privacy</a> ·
        <a href="legal/terms.html">Terms</a>
      </div>
      <div>Offline-first · Data stays on your device</div>
    </footer>
  </div>
  <script>
    const SUPPORT = 'b.ralston62989@gmail.com';

    function qsVersion() {
      try {
        const v = new URLSearchParams(location.search).get('v');
        return (v || '').trim();
      } catch (e) {
        return '';
      }
    }

    async function resolveVersion() {
      const fromQuery = qsVersion();
      if (fromQuery) return fromQuery.replace(/^v/i, '');
      try {
        const r = await fetch('version.json', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (j && j.version) return String(j.version);
        }
      } catch (e) {}
      return '';
    }

    function buildPayload() {
      const version = (document.getElementById('fb-version').value || '').trim() || 'unknown';
      const note = (document.getElementById('fb-note').value || '').trim();
      const subject = 'Schedule Pro feedback v' + version;
      const body = 'Version: ' + version + '\n\nNote:\n' + (note || '(none)');
      return { version, note, subject, body };
    }

    function setMsg(text, err) {
      const el = document.getElementById('fb-msg');
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('err', !!err);
    }

    function mailtoUrl(p) {
      return 'mailto:' + SUPPORT +
        '?subject=' + encodeURIComponent(p.subject) +
        '&body=' + encodeURIComponent(p.body);
    }

    document.getElementById('btn-email').addEventListener('click', () => {
      const p = buildPayload();
      location.href = mailtoUrl(p);
      setMsg('Opening mail app… If nothing opens, use Copy for paste.');
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      const p = buildPayload();
      const text = 'To: ' + SUPPORT + '\nSubject: ' + p.subject + '\n\n' + p.body;
      try {
        await navigator.clipboard.writeText(text);
        setMsg('Copied. Paste into email or a Play tester reply.');
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          setMsg('Copied. Paste into email or a Play tester reply.');
        } catch (e2) {
          setMsg('Copy failed — select the note and copy manually.', true);
        }
      }
    });

    (function initVersion() {
      const q = qsVersion().replace(/^v/i, '');
      document.getElementById('fb-version').value = q || '…';
      resolveVersion().then((v) => {
        document.getElementById('fb-version').value = v || 'unknown';
      });
    })();
  </script>
</body>
</html>
